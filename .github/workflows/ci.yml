name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enterprise-qa-portfolio-${{ github.ref }}
  cancel-in-progress: true

env:
  K6_VERSION: 2.4.0
  K6_SHA256: 5a5ecf23529ccf93135bc7e5b0c1cd5126ecf5f2672e22eed1556a0ab74abb87

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run validate

  profiles:
    name: k6 / ${{ matrix.profile }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [smoke, load, stress]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pinned k6
        run: |
          archive="k6-v${K6_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/${archive}"
          echo "${K6_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/k6"
          tar -xzf "$archive" -C "$RUNNER_TEMP/k6"
          echo "$RUNNER_TEMP/k6/k6-v${K6_VERSION}-linux-amd64" >> "$GITHUB_PATH"

      - name: Verify k6 version
        run: k6 version

      - name: Run ${{ matrix.profile }} profile
        run: npm run test:${{ matrix.profile }}

      - name: Upload k6 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-report-${{ matrix.profile }}
          path: reports/
          if-no-files-found: error

  report:
    name: Publish reports
    needs: [quality, profiles]
    if: always() && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download all k6 evidence
        uses: actions/download-artifact@v8
        with:
          pattern: k6-report-*
          path: site
          merge-multiple: true

      - name: Build report index
        env:
          K6_VERSION: v${{ env.K6_VERSION }}
        run: npm run site

      - name: Upload combined site
        uses: actions/upload-artifact@v7
        with:
          name: k6-site
          path: site/

      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main' && needs.profiles.result == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
